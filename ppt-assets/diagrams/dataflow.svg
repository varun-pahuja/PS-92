<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">NSFDC Scheme Sarthi — Data Flow</title>
  <desc id="d">Input to process to output flow: user profile enters hard eligibility gates, scheme band matching, weighted fit scoring, EMI amortisation and health-aware routing, producing ranked schemes, an EMI projection and a health-aware partner routing, feeding the apply and track actions, with a feedback loop to adjust inputs.</desc>
  <style>
    .bg{fill:#ffffff}
    .title{font-family:'Segoe UI',system-ui,sans-serif;font-size:31px;font-weight:800;fill:#071e44}
    .sub{font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;fill:#4f5b76}
    .col{fill:#f7f9fd;stroke:#dbe4f4;stroke-width:1.5}
    .col-proc{fill:#fff8f1;stroke:#f6dcb4;stroke-width:1.5}
    .col-out{fill:#f2f9f1;stroke:#c4e8c1;stroke-width:1.5}
    .col-label{font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:1.4px;fill:#0b2a5b}
    .box{fill:#ffffff;stroke:#c9d6ee;stroke-width:1.4}
    .box-p{fill:#ffffff;stroke:#f47920;stroke-width:1.6}
    .box-o{fill:#ffffff;stroke:#7cc47a;stroke-width:1.6}
    .bt{font-family:'Segoe UI',system-ui,sans-serif;font-size:15.5px;font-weight:700;fill:#071e44}
    .bs{font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;fill:#4f5b76}
    .num{font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;font-weight:800;fill:#b8530f}
    .flow{stroke:#8a93a8;stroke-width:2.6;fill:none}
    .fb{stroke:#b9c6e6;stroke-width:2.2;fill:none;stroke-dasharray:8 7}
    .flabel{font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;font-weight:700;fill:#5b6785}
  </style>
  <defs>
    <marker id="arw2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a93a8" />
    </marker>
    <marker id="arw3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b9c6e6" />
    </marker>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2a5b" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" />
  <text class="title" x="48" y="58">NSFDC Scheme Sarthi — Data Flow</text>
  <text class="sub" x="48" y="84">Input (user profile) → Process (eligibility · scoring · amortisation · routing) → Output (scheme · EMI · partner) → Action</text>

  <!-- INPUT column -->
  <rect class="col" x="40" y="120" width="300" height="560" rx="16" />
  <text class="col-label" x="64" y="150">1 · INPUT</text>
  <g filter="url(#soft2)">
    <rect class="box" x="64" y="168" width="252" height="80" rx="10" />
    <rect class="box" x="64" y="266" width="252" height="80" rx="10" />
    <rect class="box" x="64" y="364" width="252" height="80" rx="10" />
    <rect class="box" x="64" y="462" width="252" height="80" rx="10" />
    <rect class="box" x="64" y="560" width="252" height="80" rx="10" />
  </g>
  <text class="bt" x="84" y="200">SC status &amp; income</text>
  <text class="bs" x="84" y="224">hard eligibility gate</text>
  <text class="bt" x="84" y="298">Purpose</text>
  <text class="bs" x="84" y="322">business / education</text>
  <text class="bt" x="84" y="396">Project / course cost</text>
  <text class="bs" x="84" y="420">selects the scheme band</text>
  <text class="bt" x="84" y="494">Course recognised?</text>
  <text class="bs" x="84" y="518">education requests only</text>
  <text class="bt" x="84" y="592">State / location</text>
  <text class="bs" x="84" y="616">co-ordinates for routing</text>

  <!-- PROCESS column -->
  <rect class="col-proc" x="380" y="120" width="700" height="560" rx="16" />
  <text class="col-label" x="404" y="150">2 · PROCESS</text>
  <g filter="url(#soft2)">
    <rect class="box-p" x="404" y="168" width="652" height="88" rx="10" />
    <rect class="box-p" x="404" y="270" width="652" height="88" rx="10" />
    <rect class="box-p" x="404" y="372" width="652" height="88" rx="10" />
    <rect class="box-p" x="404" y="474" width="652" height="88" rx="10" />
    <rect class="box-p" x="404" y="576" width="652" height="88" rx="10" />
  </g>
  <text class="num" x="424" y="192">STEP 1</text>
  <text class="bt" x="500" y="192">Hard eligibility gates</text>
  <text class="bs" x="424" y="220">Scheduled Caste community · annual family income ≤ ₹5.00 lakh · cost &gt; 0</text>
  <text class="num" x="424" y="294">STEP 2</text>
  <text class="bt" x="500" y="294">Scheme band match</text>
  <text class="bs" x="424" y="322">project cost ↔ NSFDC slab — MFS · Term Loan · Aajeevika · Udyam Nidhi · Education Loan</text>
  <text class="num" x="424" y="396">STEP 3</text>
  <text class="bt" x="500" y="396">Weighted fit scoring (explainable)</text>
  <text class="bs" x="424" y="424">cost fit 32% + interest-rate fit 30% + moratorium 18% + purpose match 20% → 0–100 fit score</text>
  <text class="num" x="424" y="498">STEP 4</text>
  <text class="bt" x="500" y="498">EMI amortisation</text>
  <text class="bs" x="424" y="526">reducing-balance EMI · moratorium interest-only or deferred · tenor includes moratorium</text>
  <text class="num" x="424" y="600">STEP 5</text>
  <text class="bt" x="500" y="600">Health-aware partner routing</text>
  <text class="bs" x="424" y="628">distance 50% + fund-health 35% + scheme authorisation 15% → avoid high-NPA partners</text>

  <!-- OUTPUT column -->
  <rect class="col-out" x="1120" y="120" width="420" height="560" rx="16" />
  <text class="col-label" x="1144" y="150">3 · OUTPUT</text>
  <g filter="url(#soft2)">
    <rect class="box-o" x="1144" y="168" width="372" height="140" rx="10" />
    <rect class="box-o" x="1144" y="330" width="372" height="140" rx="10" />
    <rect class="box-o" x="1144" y="492" width="372" height="140" rx="10" />
  </g>
  <text class="bt" x="1164" y="200">Ranked scheme list</text>
  <text class="bs" x="1164" y="226">fit % · sanctionable loan</text>
  <text class="bs" x="1164" y="250">own contribution · rate · moratorium</text>
  <text class="bs" x="1164" y="280">plain-language reasons + blockers</text>
  <text class="bt" x="1164" y="362">EMI projection</text>
  <text class="bs" x="1164" y="388">monthly EMI · total interest</text>
  <text class="bs" x="1164" y="412">total payable · balance path</text>
  <text class="bs" x="1164" y="442">year-wise schedule + chart</text>
  <text class="bt" x="1164" y="524">Partner routing</text>
  <text class="bs" x="1164" y="550">route score · distance · health</text>
  <text class="bs" x="1164" y="574">scheme authorisation flag</text>
  <text class="bs" x="1164" y="604">before vs after comparison</text>

  <!-- Flow arrows -->
  <line class="flow" x1="344" y1="400" x2="376" y2="400" marker-end="url(#arw2)" />
  <line class="flow" x1="1084" y1="400" x2="1116" y2="400" marker-end="url(#arw2)" />
  <line class="flow" x1="1330" y1="684" x2="1330" y2="738" marker-end="url(#arw2)" />

  <!-- Feedback loop output -> input -->
  <path class="fb" d="M1250 690 V708 H190 V684" marker-end="url(#arw3)" />
  <text class="flabel" x="620" y="703">adjust inputs → re-run (live, deterministic)</text>

  <!-- Action band -->
  <rect x="40" y="740" width="1520" height="74" rx="16" fill="#0b2a5b" />
  <text class="flabel" x="64" y="774" style="fill:#ffd9bd">4 · ACTION</text>
  <text x="188" y="776" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;font-weight:700;fill:#ffffff">Apply via PM-SURAJ  ·  Visit the nearest healthy Channel Partner  ·  Track the application ID</text>
</svg>
