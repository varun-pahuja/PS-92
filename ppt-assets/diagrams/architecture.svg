<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">NSFDC Scheme Sarthi — System Architecture</title>
  <desc id="d">Four-layer architecture: presentation (React SPA), application/decision (scheme recommender, EMI calculator, partner router), data (scheme registry, partner registry, i18n bundles) and a future integration layer (NSFDC/SCA feed, PM-SURAJ APIs, partner NPA data).</desc>
  <style>
    .bg{fill:#ffffff}
    .title{font-family:'Segoe UI',system-ui,sans-serif;font-size:31px;font-weight:800;fill:#071e44}
    .sub{font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;fill:#4f5b76}
    .band{fill:#f7f9fd;stroke:#dbe4f4;stroke-width:1.5}
    .band-warm{fill:#fff8f1;stroke:#f6dcb4;stroke-width:1.5}
    .band-future{fill:#fbfcff;stroke:#b9c6e6;stroke-width:1.5;stroke-dasharray:9 7}
    .band-label{font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;font-weight:800;letter-spacing:1.4px;fill:#0b2a5b}
    .box{fill:#ffffff;stroke:#c9d6ee;stroke-width:1.4}
    .box-core{fill:#ffffff;stroke:#f47920;stroke-width:1.8}
    .box-future{fill:#ffffff;stroke:#b9c6e6;stroke-width:1.2}
    .bt{font-family:'Segoe UI',system-ui,sans-serif;font-size:16px;font-weight:700;fill:#071e44}
    .bs{font-family:'Segoe UI',system-ui,sans-serif;font-size:12.5px;fill:#4f5b76}
    .flow{stroke:#8a93a8;stroke-width:2.4;fill:none}
    .note{font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;fill:#8a5a1e}
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a93a8" />
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2a5b" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" />
  <text class="title" x="48" y="58">NSFDC Scheme Sarthi — System Architecture</text>
  <text class="sub" x="48" y="84">SIH 2026 · PS 26092 · AI-Driven Scheme Matching for Marginalized Entrepreneurs</text>

  <!-- Presentation layer -->
  <rect class="band" x="40" y="104" width="1520" height="152" rx="18" />
  <text class="band-label" x="64" y="134">PRESENTATION LAYER — BROWSER SPA</text>
  <g filter="url(#soft)">
    <rect class="box" x="64" y="150" width="352" height="88" rx="12" />
    <rect class="box" x="436" y="150" width="352" height="88" rx="12" />
    <rect class="box" x="808" y="150" width="352" height="88" rx="12" />
    <rect class="box" x="1180" y="150" width="352" height="88" rx="12" />
  </g>
  <text class="bt" x="88" y="186">React + Vite + TypeScript</text>
  <text class="bs" x="88" y="210">component-based · one-command dev</text>
  <text class="bt" x="460" y="186">Mobile-responsive UI</text>
  <text class="bs" x="460" y="210">low-bandwidth friendly</text>
  <text class="bt" x="832" y="186">Bilingual EN / हिन्दी</text>
  <text class="bs" x="832" y="210">extensible to more languages</text>
  <text class="bt" x="1204" y="186">GIGW accessibility toolbar</text>
  <text class="bs" x="1204" y="210">text size · contrast · screen reader</text>

  <!-- Application layer -->
  <rect class="band-warm" x="40" y="286" width="1520" height="184" rx="18" />
  <text class="band-label" x="64" y="316">APPLICATION / DECISION LAYER</text>
  <g filter="url(#soft)">
    <rect class="box-core" x="64" y="332" width="480" height="118" rx="12" />
    <rect class="box-core" x="564" y="332" width="480" height="118" rx="12" />
    <rect class="box-core" x="1064" y="332" width="480" height="118" rx="12" />
  </g>
  <text class="bt" x="88" y="368">Scheme Recommender Engine</text>
  <text class="bs" x="88" y="394">explainable weighted decision tree</text>
  <text class="bs" x="88" y="416">inputs: purpose · cost · income · course</text>
  <text class="bs" x="88" y="438">output: fit score + reasons + blockers</text>
  <text class="bt" x="588" y="368">EMI Calculator</text>
  <text class="bs" x="588" y="394">reducing-balance amortisation</text>
  <text class="bs" x="588" y="416">interest-only / deferred moratorium</text>
  <text class="bs" x="588" y="438">schedule + total interest + chart</text>
  <text class="bt" x="1088" y="368">Geo-Spatial Partner Router</text>
  <text class="bs" x="1088" y="394">haversine + fund-health scoring</text>
  <text class="bs" x="1088" y="416">distance 50% · health 35% · auth 15%</text>
  <text class="bs" x="1088" y="438">avoids high-NPA / stressed partners</text>

  <!-- Data layer -->
  <rect class="band" x="40" y="500" width="1520" height="158" rx="18" />
  <text class="band-label" x="64" y="530">DATA LAYER — CLIENT-SIDE, SWAPPABLE</text>
  <g filter="url(#soft)">
    <rect class="box" x="64" y="546" width="480" height="92" rx="12" />
    <rect class="box" x="564" y="546" width="480" height="92" rx="12" />
    <rect class="box" x="1064" y="546" width="480" height="92" rx="12" />
  </g>
  <text class="bt" x="88" y="582">Scheme Registry</text>
  <text class="bs" x="88" y="606">NSFDC slabs · rates · limits · moratoriums (real)</text>
  <text class="bt" x="588" y="582">Partner Registry</text>
  <text class="bs" x="588" y="606">real names / types · mock fund-health &amp; NPA</text>
  <text class="bt" x="1088" y="582">i18n Bundles</text>
  <text class="bs" x="1088" y="606">English + Hindi dictionaries</text>

  <!-- Integration layer -->
  <rect class="band-future" x="40" y="688" width="1520" height="152" rx="18" />
  <text class="band-label" x="64" y="718">INTEGRATION LAYER — FUTURE (DATA-SHARING MOU / APIs)</text>
  <rect class="box-future" x="64" y="734" width="480" height="86" rx="12" />
  <rect class="box-future" x="564" y="734" width="480" height="86" rx="12" />
  <rect class="box-future" x="1064" y="734" width="480" height="86" rx="12" />
  <text class="bt" x="88" y="770">NSFDC / SCA data feed</text>
  <text class="bs" x="88" y="794">live scheme + allocation updates</text>
  <text class="bt" x="588" y="770">PM-SURAJ APIs</text>
  <text class="bs" x="588" y="794">application submit + status tracking</text>
  <text class="bt" x="1088" y="770">Partner NPA / fund-utilisation</text>
  <text class="bs" x="1088" y="794">replaces the mock health score</text>

  <!-- Flow arrows between layers -->
  <line class="flow" x1="800" y1="256" x2="800" y2="284" marker-end="url(#arw)" />
  <line class="flow" x1="800" y1="470" x2="800" y2="498" marker-end="url(#arw)" />
  <line class="flow" x1="800" y1="658" x2="800" y2="686" marker-end="url(#arw)" />
  <line class="flow" x1="1310" y1="688" x2="1310" y2="658" marker-end="url(#arw)" stroke-dasharray="7 6" />
  <text class="note" x="1180" y="676">data feed (dashed) drives the registries</text>
</svg>
